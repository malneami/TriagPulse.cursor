services:
  postgres:
    image: postgres:16-alpine
    container_name: triagepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: triagepulse
      POSTGRES_PASSWORD: triagepulse
      POSTGRES_DB: triagepulse
    ports:
      - "55432:5432"
    volumes:
      - triagepulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagepulse -d triagepulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  triagepulse_pgdata:
